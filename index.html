<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>ريدان للمندي · ديليفري فاخر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        :root {
            --gold: #d4af37;
            --gold-light: #f5e7b0;
            --gold-dark: #b8860b;
            --bg: #0a0808;
            --card-bg: rgba(18, 16, 16, 0.7);
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(212, 175, 55, 0.12);
            --text: #f5ede0;
            --text-muted: #b8a88a;
            --radius: 28px;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background-image: radial-gradient(ellipse at 20% 20%, rgba(212, 175, 55, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(212, 175, 55, 0.03) 0%, transparent 50%);
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1717;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 10px;
        }

        .app-wrapper {
            max-width: 1440px;
            width: 100%;
            background: rgba(16, 14, 14, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.12);
            border-radius: 56px;
            padding: 24px 28px 32px;
            box-shadow: var(--shadow), 0 0 0 1px rgba(212, 175, 55, 0.06) inset;
            transition: all .3s;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.08);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(145deg, var(--gold), var(--gold-dark));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #0a0808;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            flex-shrink: 0;
        }
        .logo-text h1 {
            font-weight: 800;
            font-size: 1.6rem;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
        }
        .logo-text span {
            display: block;
            font-size: .75rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .lang-toggle {
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 8px 16px;
            border-radius: 60px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: .8rem;
            cursor: pointer;
            transition: .25s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .lang-toggle:hover {
            background: rgba(212, 175, 55, 0.12);
            border-color: var(--gold);
            color: var(--gold);
        }
        .admin-btn {
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 10px 24px;
            border-radius: 60px;
            color: var(--gold);
            font-weight: 600;
            font-size: .85rem;
            cursor: pointer;
            transition: .25s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-btn:hover {
            background: rgba(212, 175, 55, 0.12);
            border-color: var(--gold);
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.1);
        }

        /* ===== MAIN GRID ===== */
        .main-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 28px;
        }
        @media (max-width: 920px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 24px 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            transition: all .3s;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -60%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.03), transparent 70%);
            pointer-events: none;
        }
        .card:hover {
            border-color: rgba(212, 175, 55, 0.2);
            box-shadow: 0 16px 56px rgba(0, 0, 0, 0.6);
        }
        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.08);
            letter-spacing: 0.3px;
        }
        .card-title i {
            font-size: 1.2rem;
            color: var(--gold);
        }
        .card-title .en-label {
            font-weight: 400;
            color: var(--text-muted);
            font-size: .75rem;
            margin-right: 6px;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: .72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .form-group label .en {
            font-weight: 400;
            color: #6a5f4a;
            font-size: .65rem;
            margin-right: 6px;
        }
        select,
        input {
            width: 100%;
            padding: 14px 20px;
            background: rgba(10, 10, 10, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 60px;
            color: var(--text);
            font-weight: 500;
            font-size: .95rem;
            transition: .25s;
            outline: none;
        }
        select:focus,
        input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.08);
            background: #0f0d0d;
        }
        select option {
            background: #1a1717;
        }

        .btn-primary {
            background: linear-gradient(145deg, var(--gold), var(--gold-dark));
            border: none;
            padding: 16px 28px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            color: #0a0808;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            cursor: pointer;
            transition: .3s;
            box-shadow: 0 6px 28px rgba(212, 175, 55, 0.2);
            letter-spacing: 0.3px;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            background: linear-gradient(145deg, #e8c94a, #c8971a);
            box-shadow: 0 10px 45px rgba(212, 175, 55, 0.3);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 10px 18px;
            border-radius: 60px;
            color: var(--gold);
            font-weight: 600;
            font-size: .8rem;
            transition: .25s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.08);
            border-color: var(--gold);
        }

        /* ===== DRIVER GRID ===== */
        .drivers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .drivers-grid::-webkit-scrollbar {
            width: 4px;
        }
        .drivers-grid::-webkit-scrollbar-track {
            background: #1a1717;
            border-radius: 10px;
        }
        .drivers-grid::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 10px;
        }

        .driver-card {
            background: rgba(30, 27, 27, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.06);
            border-radius: 24px;
            padding: 18px 16px 16px;
            text-align: center;
            transition: all .3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .driver-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.04), transparent 70%);
            pointer-events: none;
            opacity: 0;
            transition: .4s;
        }
        .driver-card:hover::after {
            opacity: 1;
        }
        .driver-card:hover {
            border-color: rgba(212, 175, 55, 0.25);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(212, 175, 55, 0.05);
            background: rgba(40, 36, 36, 0.7);
        }
        .driver-card.selected {
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15), inset 0 0 30px rgba(212, 175, 55, 0.05);
        }
        .driver-card .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
            background: #2a2525;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: var(--gold);
        }
        .driver-card .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .driver-card .dname {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 2px;
        }
        .driver-card .dbadge {
            font-size: .7rem;
            font-weight: 600;
            color: var(--gold);
            background: rgba(212, 175, 55, 0.08);
            padding: 0 12px;
            border-radius: 40px;
            display: inline-block;
            border: 1px solid rgba(212, 175, 55, 0.05);
        }
        .driver-card .dstatus {
            font-size: .65rem;
            font-weight: 700;
            margin-top: 4px;
            padding: 2px 12px;
            border-radius: 30px;
            display: inline-block;
        }
        .driver-card .dstatus.available {
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.2);
        }
        .driver-card .dstatus.out {
            background: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.2);
        }
        .driver-card .dorders {
            font-size: .75rem;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .driver-card .dorders i {
            color: var(--gold);
            font-size: .7rem;
        }
        .number-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 8px;
            max-height: 60px;
            overflow-y: auto;
        }
        .number-grid .num-item {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 8px;
            padding: 2px 8px;
            font-size: .7rem;
            font-weight: 600;
            color: var(--gold);
            min-width: 28px;
            text-align: center;
            transition: .2s;
        }
        .number-grid .num-item:hover {
            background: rgba(212, 175, 55, 0.15);
            transform: scale(1.05);
        }
        .driver-card .toggle-vis {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.4);
            border: none;
            color: var(--text-muted);
            font-size: .7rem;
            padding: 2px 8px;
            border-radius: 30px;
            cursor: pointer;
            transition: .2s;
            backdrop-filter: blur(4px);
        }
        .driver-card .toggle-vis:hover {
            color: var(--gold);
            background: rgba(0, 0, 0, 0.6);
        }
        .driver-card.hidden-driver {
            opacity: 0.3;
            filter: grayscale(0.8);
            border-color: transparent;
        }
        .driver-card.hidden-driver:hover {
            opacity: 0.5;
            transform: none;
            box-shadow: none;
        }

        /* ===== QUEUE BAR ===== */
        .queue-bar {
            background: rgba(0, 0, 0, 0.35);
            padding: 12px 18px;
            border-radius: 60px;
            border: 1px solid rgba(212, 175, 55, 0.06);
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            backdrop-filter: blur(4px);
        }
        .queue-bar .label {
            color: var(--text-muted);
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .queue-bar .qlist {
            color: var(--gold);
            font-weight: 600;
            font-size: .8rem;
            flex: 1;
            min-width: 100px;
            direction: ltr;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
        }
        .queue-bar .qlist span {
            background: rgba(212, 175, 55, 0.06);
            padding: 0 10px;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.04);
        }

        /* ===== ACTIVE ORDERS MINI ===== */
        .active-orders-mini {
            margin-top: 16px;
            max-height: 140px;
            overflow-y: auto;
        }
        .active-orders-mini .order-mini {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: rgba(25, 22, 22, 0.4);
            border-radius: 16px;
            margin-bottom: 6px;
            border: 1px solid rgba(212, 175, 55, 0.04);
            font-size: .8rem;
        }
        .active-orders-mini .order-mini .onum {
            font-weight: 700;
            color: var(--text);
        }
        .active-orders-mini .order-mini .odriver {
            color: var(--text-muted);
        }
        .active-orders-mini .order-mini .otime {
            color: #6a5f4a;
            font-size: .65rem;
        }
        .active-orders-mini .order-mini .oreturn {
            background: linear-gradient(145deg, #c0392b, #a93226);
            border: none;
            padding: 2px 12px;
            border-radius: 60px;
            font-weight: 700;
            font-size: .6rem;
            color: #fff;
            cursor: pointer;
            transition: .2s;
        }
        .active-orders-mini .order-mini .oreturn:hover {
            transform: scale(1.05);
        }

        /* ===== SELECTED DRIVER LABEL ===== */
        .selected-driver-label {
            text-align: center;
            margin-top: 10px;
            font-size: .85rem;
            color: var(--gold);
            border-top: 1px solid rgba(212, 175, 55, 0.05);
            padding-top: 12px;
        }
        .selected-driver-label .name {
            font-weight: 700;
        }
        .selected-driver-label .none {
            color: var(--text-muted);
        }

        /* ===== ADMIN OVERLAY ===== */
        .admin-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
        }
        .admin-overlay.active {
            display: flex;
        }
        .admin-panel {
            background: #141111;
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 48px;
            max-width: 1100px;
            width: 100%;
            max-height: 92vh;
            padding: 28px 32px 34px;
            overflow-y: auto;
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.9);
            position: relative;
        }
        .admin-panel::-webkit-scrollbar {
            width: 5px;
        }
        .admin-panel::-webkit-scrollbar-track {
            background: #1a1717;
            border-radius: 10px;
        }
        .admin-panel::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 10px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }
        .admin-header h2 {
            color: var(--gold);
            font-weight: 700;
            font-size: 1.4rem;
        }
        .admin-header h2 .en {
            font-weight: 400;
            color: var(--text-muted);
            font-size: .8rem;
            margin-right: 8px;
        }
        .admin-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 2rem;
            cursor: pointer;
            transition: .2s;
            padding: 0 8px;
        }
        .admin-close:hover {
            color: var(--gold);
            transform: rotate(90deg);
        }
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
        }
        @media (max-width: 760px) {
            .admin-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }
        .admin-section-title {
            color: var(--gold);
            font-weight: 700;
            font-size: .95rem;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-section-title .en {
            font-weight: 400;
            color: var(--text-muted);
            font-size: .75rem;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .85rem;
        }
        .admin-table th {
            text-align: right;
            padding: 8px 6px;
            color: var(--gold);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            font-weight: 600;
        }
        .admin-table td {
            padding: 8px 6px;
            border-bottom: 1px solid #2a2525;
            color: var(--text);
        }
        .admin-table .actions i {
            margin: 0 4px;
            cursor: pointer;
            color: var(--text-muted);
            transition: .15s;
            font-size: .9rem;
        }
        .admin-table .actions i:hover {
            color: var(--gold);
        }
        .admin-driver-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #2a2525;
            flex-wrap: wrap;
            gap: 8px;
            transition: .2s;
        }
        .admin-driver-row:hover {
            background: rgba(212, 175, 55, 0.02);
            border-radius: 12px;
            padding: 10px 8px;
        }
        .admin-driver-row .info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .admin-driver-row .info .avatar-wrap {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            overflow: hidden;
            flex-shrink: 0;
            background: #2a2525;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .admin-driver-row .info .avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .admin-driver-row .info .avatar-wrap .initials {
            font-size: 18px;
            font-weight: 700;
            color: var(--gold);
        }
        .admin-driver-row .info .num {
            font-weight: 700;
            color: var(--gold);
            font-size: .85rem;
            margin-left: 4px;
        }
        .admin-driver-row .info .dname {
            font-weight: 600;
            color: var(--text);
        }
        .admin-driver-row .info .status-badge {
            font-size: .6rem;
            padding: 2px 10px;
            border-radius: 30px;
            font-weight: 700;
        }
        .admin-driver-row .info .status-badge.available {
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.2);
        }
        .admin-driver-row .info .status-badge.out {
            background: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.2);
        }
        .admin-driver-row .actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .admin-driver-row .actions .upload-btn {
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 30px;
            padding: 4px 10px;
            color: var(--text-muted);
            font-size: .65rem;
            cursor: pointer;
            transition: .2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .admin-driver-row .actions .upload-btn:hover {
            background: rgba(212, 175, 55, 0.12);
            color: var(--gold);
        }
        .admin-driver-row .actions .upload-btn input[type="file"] {
            display: none;
        }

            // ===== HELPERS =====
            function generateId() { return Date.now() + Math.random(); }

            function saveState() {
                try {
                    localStorage.setItem('deliveryData', JSON.stringify({ drivers, orders, archive, nextOrderId }));
                } catch (e) {}
            }

            function loadState() {
                try {
                    const raw = localStorage.getItem('deliveryData');
                    if (raw) {
                        const data = JSON.parse(raw);
                        drivers = data.drivers || drivers;
                        orders = data.orders || [];
                        archive = data.archive || [];
                        nextOrderId = data.nextOrderId || 1;
                        drivers.forEach(d => { if (d.hidden === undefined) d.hidden = false; if (d.status === undefined) d
                                .status = 'متاح'; });
                    }
                } catch (e) {}
            }

                const tEl = document.getElementById('toast');
                tEl.textContent = msg;
                tEl.classList.add('show');
                clearTimeout(tEl._hide);
                tEl._hide = setTimeout(() => tEl.classList.remove('show'), duration);
            }

            function getActiveOrdersForDriver(driverId) {
                return orders.filter(o => o.driverId === driverId && o.status === 'في التوصيل');
            }

            function getOrderNumbersForDriver(driverId) {
                return getActiveOrdersForDriver(driverId).map(o => o.orderNumber);
            }

            function updateDriverStatus(driverId) {
                const driver = drivers.find(d => d.id === driverId);
                if (!driver) return;
                const active = getActiveOrdersForDriver(driverId);
                driver.status = active.length > 0 ? 'خارج للتوصيل' : 'متاح';
                driver.orders = active.length;
            }

            function isOrderNumberUsed(num) {
                return orders.some(o => o.orderNumber === num) || archive.some(a => a.orderNumber === num);
            }

            // ===== COMPRESS IMAGE (Low detail) =====
            function compressImage(file, maxWidth = 200, maxHeight = 200, quality = 0.5) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = new Image();
                        img.onload = function() {
                            let width = img.width;
                            let height = img.height;
                            if (width > maxWidth) {
                                height = (maxWidth / width) * height;
                                width = maxWidth;
                            }
                            if (height > maxHeight) {
                                width = (maxHeight / height) * width;
                                height = maxHeight;
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.imageSmoothingEnabled = true;
                            ctx.imageSmoothingQuality = 'low';
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', quality));
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }

            // ===== RENDER =====
            function renderAll() {
                renderDriversGrid();
                renderActiveMini();
                renderAdmin();
                updateQueue();
                updateSelectedDriverDisplay();
            }

            function renderDriversGrid() {

                grid.innerHTML = '';
                const visible = drivers.filter(d => !d.hidden);
                if (visible.length === 0) {
                    grid.innerHTML =
                        `<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:30px;">${t('noDrivers')}</div>`;
                    return;
                }
                drivers.forEach((d) => {
                    const isHidden = d.hidden === true;
                    const card = document.createElement('div');
                    card.className = `driver-card${selectedDriverId === d.id ? ' selected' : ''}${isHidden ? ' hidden-driver' : ''}`;
                    card.dataset.id = d.id;
                    const orderNums = getOrderNumbersForDriver(d.id);
                    const statusClass = d.status === 'متاح' ? 'available' : 'out';
                    const statusText = d.status === 'متاح' ? t('available') : t('out');

                    let avatarHtml = '';
                    if (d.image && d.image.startsWith('data:image')) {
                        avatarHtml = `<img src="${d.image}" alt="${d.name}">`;
                    } else {
                        avatarHtml = d.name.charAt(0);

                    let numberGridHtml = '';
                    if (orderNums.length > 0) {
                        numberGridHtml = `<div class="number-grid">${orderNums.map(n => `<span class="num-item">${n}</span>`).join('')}</div>`;
                    } else {
                        numberGridHtml = `<div class="order-count-badge" style="color:#6a5f4a;font-size:.7rem;">—</div>`;
                    }

                    card.innerHTML = `
                        <button class="toggle-vis" data-id="${d.id}" title="${isHidden ? t('show') : t('hide')}">
                            <i class="fas ${isHidden ? 'fa-eye' : 'fa-eye-slash'}"></i>
                        </button>
                        <div class="avatar">${avatarHtml}</div>
                        <div class="dname">${d.name}</div>
                        <div class="dbadge">#${drivers.indexOf(d)+1}</div>
                        <div class="dstatus ${statusClass}">${statusText}</div>
                        <div class="dorders"><i class="fas fa-box"></i> ${d.orders} ${d.orders === 1 ? 'طلب' : 'طلبات'}</div>
                        ${numberGridHtml}
                    `;
                    grid.appendChild(card);

                    card.addEventListener('click', function(e) {
                        if (e.target.closest('.toggle-vis')) return;
                        const id = parseInt(this.dataset.id);
                        selectDriver(id);
                        document.getElementById('orderNumber').focus();
                    });

                    const toggleBtn = card.querySelector('.toggle-vis');
                    toggleBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        const driver = drivers.find(d => d.id === id);
                        if (driver) {
                            driver.hidden = !driver.hidden;
                            if (selectedDriverId === id) {
                                selectedDriverId = null;
                            }
                            saveState();
                            renderAll();
                            showToast(driver.hidden ? t('hide') : t('show'));
                        }
                    });
                });
            }

            function selectDriver(id) {
                const driver = drivers.find(d => d.id === id);
                if (!driver || driver.hidden) {
                    selectedDriverId = null;
                    renderAll();
                    return;
                }
                selectedDriverId = id;
                renderAll();
                const card = document.querySelector(`.driver-card[data-id="${id}"]`);
                if (card) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            function updateSelectedDriverDisplay() {
                const nameSpan = document.getElementById('selectedDriverName');
                const label = document.getElementById('selectedLabel');
                label.textContent = t('selectedLabel');
                if (selectedDriverId) {
                    const driver = drivers.find(d => d.id === selectedDriverId);
                    nameSpan.textContent = driver ? driver.name : t('none');
                } else {
                    nameSpan.textContent = t('none');
                }
            }

            function renderActiveMini() {
                const container = document.getElementById('activeOrdersMini');
                container.innerHTML = '';
                const active = orders.filter(o => o.status === 'في التوصيل');
                if (active.length === 0) {
                    container.innerHTML =
                        `<div style="color:var(--text-muted);text-align:center;padding:8px;font-size:.8rem;">${t('noOrders')}</div>`;
                    return;
                }
                active.forEach(o => {
                    const div = document.createElement('div');
                    div.className = 'order-mini';
                    div.innerHTML = `
                        <span class="onum">#${o.orderNumber}</span>
                        <span class="odriver"><i class="fas fa-user"></i> ${o.driverName}</span>
                        <span class="otime">${o.time}</span>
                        <button class="oreturn" data-id="${o.id}"><i class="fas fa-undo-alt"></i> ${t('returnBtn')}</button>
                    `;
                    container.appendChild(div);
                });
                container.querySelectorAll('.oreturn').forEach(btn => {
                    btn.onclick = function() { returnOrder(this.dataset.id); };
                });
            }

            function updateQueue() {
                const qList = document.getElementById('queueList');
                const visible = drivers.filter(d => !d.hidden);
                if (visible.length) {
                    qList.innerHTML = visible.map((d, i) => `<span>${i+1}-${d.name}</span>`).join('');
                } else {
                    qList.textContent = '—';
                }
            }

            // ===== ADMIN RENDER with Image Upload =====
            function renderAdmin() {
                const adminList = document.getElementById('adminDriverList');
                adminList.innerHTML = '';
                drivers.forEach((d, idx) => {
                    const row = document.createElement('div');
                    row.className = 'admin-driver-row';
                    const isHidden = d.hidden === true;
                    const statusClass = d.status === 'متاح' ? 'available' : 'out';
                    const statusText = d.status === 'متاح' ? t('available') : t('out');

                    let avatarHtml = '';
                    if (d.image && d.image.startsWith('data:image')) {
                        avatarHtml = `<img src="${d.image}" alt="${d.name}">`;
                    } else {
                        avatarHtml = `<span class="initials">${d.name.charAt(0)}</span>`;
                    }

                    row.innerHTML = `
                        <div class="info">
                            <div class="avatar-wrap">${avatarHtml}</div>
                            <span class="num">#${idx+1}</span>
                            <span class="dname">${d.name}</span>
                            <span class="badge-gold">${d.orders}</span>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                            ${isHidden ? '<span style="color:#6a5f4a;font-size:.65rem;">[مخفي]</span>' : ''}
                        </div>
                        <div class="actions">
                            <label class="upload-btn">
                                <i class="fas fa-camera"></i> <span>${t('uploadPhoto')}</span>
                                <input type="file" accept="image/*" data-id="${d.id}">
                            </label>
                            ${d.image ? `<span class="remove-img" data-id="${d.id}" title="${t('removePhoto')}"><i class="fas fa-times-circle"></i></span>` : ''}
                            <i class="fas ${isHidden ? 'fa-eye' : 'fa-eye-slash'}" data-id="${d.id}" data-action="toggle" title="${isHidden ? t('show') : t('hide')}"></i>
                            <i class="fas fa-trash-alt" data-id="${d.id}" data-action="delete" title="حذف"></i>
                            <i class="fas fa-arrow-up" data-id="${d.id}" data-action="up" title="رفع"></i>
                            <i class="fas fa-arrow-down" data-id="${d.id}" data-action="down" title="خفض"></i>
                        </div>
                    `;
                    adminList.appendChild(row);
                });

                // Image upload with compression (low detail)
                document.querySelectorAll('#adminDriverList .upload-btn input[type="file"]').forEach(input => {
                    input.onchange = async function(e) {
                        const file = this.files[0];
                        if (!file) return;
                        if (file.size > 5 * 1024 * 1024) {
                            showToast('الرجاء اختيار صورة أقل من 5 ميجابايت');
                            this.value = '';
                            return;
                        }
                        try {
                            const compressed = await compressImage(file, 200, 200, 0.6);
                            const id = parseInt(this.dataset.id);
                            const driver = drivers.find(d => d.id === id);
                            if (driver) {
                                driver.image = compressed;
                                saveState();
                                renderAll();
                                showToast(t('imageUpdated'));
                            }
                        } catch (err) {
                            showToast('حدث خطأ أثناء ضغط الصورة');
                        }
                        this.value = '';
                    };
                });

                // Remove image
                document.querySelectorAll('#adminDriverList .remove-img').forEach(el => {
                    el.onclick = function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        const driver = drivers.find(d => d.id === id);
                        if (driver) {
                            driver.image = '';
                            saveState();
                            renderAll();
                            showToast('تم حذف الصورة');
                        }
                    };
                });

                // Admin actions (delete, move, toggle)
                document.querySelectorAll('#adminDriverList .actions i').forEach(el => {
                    el.onclick = function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        const action = this.dataset.action;
                        if (action === 'delete') {
                            if (confirm(t('confirmDelete'))) {
                                drivers = drivers.filter(d => d.id !== id);
                                orders = orders.filter(o => o.driverId !== id);
                                if (selectedDriverId === id) selectedDriverId = null;
                                saveState();
                                renderAll();
                                showToast(t('driverDeleted'));
                            }
                        } else if (action === 'up') {
                            const idx = drivers.findIndex(d => d.id === id);
                            if (idx > 0) {
                                [drivers[idx], drivers[idx - 1]] = [drivers[idx - 1], drivers[idx]];
                                saveState();
                                renderAll();
                                showToast('⬆ ' + t('resetDone'));
                            }
                        } else if (action === 'down') {
                            const idx = drivers.findIndex(d => d.id === id);
                            if (idx < drivers.length - 1) {
                                [drivers[idx], drivers[idx + 1]] = [drivers[idx + 1], drivers[idx]];
                                saveState();
                                renderAll();
                                showToast('⬇ ' + t('resetDone'));
                            }
                        } else if (action === 'toggle') {
                            const driver = drivers.find(d => d.id === id);
                            if (driver) {
                                driver.hidden = !driver.hidden;
                                if (selectedDriverId === id) {
                                    selectedDriverId = null;
                                }
                                saveState();
                                renderAll();
                                showToast(driver.hidden ? t('hide') : t('show'));
                            }
                        }
                    };
                });

                // Admin orders
                const adminOrders = document.getElementById('adminOrdersList');
                adminOrders.innerHTML = '';
                if (orders.length === 0) {
                    adminOrders.innerHTML = `<div style="color:var(--text-muted);padding:8px 0;">${t('noOrders')}</div>`;
                } else {
                    const table = document.createElement('table');
                    table.className = 'admin-table';
                    table.innerHTML =
                        `<thead><tr><th>#</th><th>${currentLang === 'ar' ? 'الدليفري' : 'Driver'}</th><th>${currentLang === 'ar' ? 'رقم الطلب' : 'Order'}</th><th>${currentLang === 'ar' ? 'الحالة' : 'Status'}</th><th></th></tr></thead><tbody></tbody>`;
                    orders.forEach((o, idx) => {
                        const tr = document.createElement('tr');
                        const statusText = o.status === 'في التوصيل' ? t('statusActive') : t('statusDone');
                        tr.innerHTML = `
                            <td>${idx+1}</td>
                            <td>${o.driverName}</td>
                            <td>${o.orderNumber}</td>
                            <td>${statusText}</td>
                            <td class="actions">
                                <i class="fas fa-check" data-id="${o.id}" data-action="complete" style="color:#9bc49b;" title="${currentLang === 'ar' ? 'تسليم' : 'Complete'}"></i>
                                <i class="fas fa-trash-alt" data-id="${o.id}" data-action="delete" style="color:#b55a5a;" title="${currentLang === 'ar' ? 'حذف' : 'Delete'}"></i>
                                ${o.status === 'في التوصيل' ? `<i class="fas fa-undo-alt" data-id="${o.id}" data-action="return" style="color:var(--gold);" title="${currentLang === 'ar' ? 'رجوع' : 'Return'}"></i>` : ''}
                            </td>
                        `;
                        table.querySelector('tbody').appendChild(tr);
                    });
                    adminOrders.appendChild(table);
                    adminOrders.querySelectorAll('.actions i').forEach(el => {
                        el.onclick = function() {
                            const id = this.dataset.id;
                            const action = this.dataset.action;
                            if (action === 'delete') {
                                if (confirm(t('confirmDeleteOrder'))) {
                                    const order = orders.find(o => o.id == id);
                                    if (order) {
                                        const driver = drivers.find(d => d.id === order.driverId);
                                        if (driver) {
                                            driver.orders = Math.max(0, driver.orders - 1);
                                            updateDriverStatus(driver.id);
                                        }
                                    }
                                    orders = orders.filter(o => o.id != id);
                                    saveState();
                                    renderAll();
                                    showToast(t('orderReturned'));
                                }
                            } else if (action === 'complete' || action === 'return') {
                                const order = orders.find(o => o.id == id);
                                if (order && order.status === 'في التوصيل') {
                                    order.status = 'تم التوصيل';
                                    order.returnTime = new Date().toLocaleTimeString('ar-EG');
                                    const driver = drivers.find(d => d.id === order.driverId);
                                    if (driver) {
                                        driver.orders = Math.max(0, driver.orders - 1);
                                        updateDriverStatus(driver.id);
                                    }
                                    saveState();
                                    renderAll();
                                    showToast(t('orderReturned'));
                                }
                            }
                        };
                    });
                }

                // Archive
                const archiveContainer = document.getElementById('archiveList');
                archiveContainer.innerHTML = '';
                if (archive.length === 0) {
                    archiveContainer.innerHTML =
                        `<div style="color:var(--text-muted);padding:8px 0;">${currentLang === 'ar' ? 'لا يوجد أرشيف' : 'No archive'}</div>`;
                } else {
                    const ul = document.createElement('div');
                    archive.slice().reverse().forEach(a => {
                        const div = document.createElement('div');
                        div.style.cssText =
                            'padding:6px 0; border-bottom:1px solid #1f1b1b; display:flex; gap:12px; flex-wrap:wrap; font-size:.8rem;';
                        div.innerHTML = `
                            <span><i class="fas fa-hashtag"></i> ${a.orderNumber}</span>
                            <span>${a.driverName}</span>
                            <span style="color:var(--text-muted);">${t('timeOut')}: ${a.time}</span>
                            ${a.returnTime ? `<span style="color:var(--text-muted);">${t('timeReturn')}: ${a.returnTime}</span>` : ''}
                        `;
                        ul.appendChild(div);
                    });
                    archiveContainer.appendChild(ul);
                }
            }

            // ===== ACTIONS =====
            function returnOrder(orderId) {
                const order = orders.find(o => o.id == orderId);
                if (!order || order.status !== 'في التوصيل') return;
                order.status = 'تم التوصيل';
                order.returnTime = new Date().toLocaleTimeString('ar-EG');
                const driver = drivers.find(d => d.id === order.driverId);
                if (driver) {
                    driver.orders = Math.max(0, driver.orders - 1);
                    updateDriverStatus(driver.id);
                }
                saveState();
                renderAll();
                showToast(t('orderReturned') + ` #${order.orderNumber}`);
            }

            function startDelivery() {
                const type = document.getElementById('deliveryType').value;
                const driverId = selectedDriverId;
                const orderNumber = document.getElementById('orderNumber').value.trim();
                if (!orderNumber) { showToast(t('enterOrder')); return; }
                if (isOrderNumberUsed(orderNumber)) {
                    document.getElementById('orderError').style.display = 'block';
                    showToast(t('orderExists'));
                    return;
                }
                document.getElementById('orderError').style.display = 'none';

                if (!driverId) {
                    showToast(t('selectDriver'));
                    return;
                }
                const driver = drivers.find(d => d.id === driverId);
                if (!driver || driver.hidden) {
                    showToast(t('selectDriver'));
                    return;
                }

                const newOrder = {
                    id: generateId(),
                    driverId: driver.id,
                    driverName: driver.name,
                    orderNumber: orderNumber,
                    type: type,
                    time: new Date().toLocaleTimeString('ar-EG'),
                    returnTime: null,
                    status: 'في التوصيل'
                };
                orders.push(newOrder);
                driver.orders += 1;
                updateDriverStatus(driver.id);

                // rotate driver to end (only among visible drivers)
                const visible = drivers.filter(d => !d.hidden);
                const idx = drivers.findIndex(d => d.id === driver.id);
                if (idx !== -1 && idx < drivers.length - 1) {
                    const [item] = drivers.splice(idx, 1);
                    drivers.push(item);
                }

                document.getElementById('orderNumber').value = '';
                saveState();
                renderAll();
                showToast(t('orderStarted') + ` #${orderNumber} - ${driver.name}`);
            }

            function resetQueue() {
                saveState();
                renderAll();
                showToast(t('resetDone'));
            }

            function endDay() {
                if (orders.length === 0 && archive.length === 0) {
                    showToast(t('confirmEndDay'));
                    return;
                }
                orders.forEach(o => {
                    archive.push({
                        orderNumber: o.orderNumber,
                        driverName: o.driverName,
                        type: o.type,
                        time: o.time,
                        returnTime: o.returnTime || '',
                        status: o.status
                    });
                });
                orders = [];
                drivers.forEach(d => { d.orders = 0;
                    d.status = 'متاح'; });
                saveState();
                renderAll();
                showToast(t('dayEnded'));
            }

            // ===== PRINT PDF =====
            function printPdf() {
                const allOrders = [...orders, ...archive];
                if (allOrders.length === 0) {
                    showToast(t('printNoOrders'));
                    return;
                }
                allOrders.sort((a, b) => {
                    const na = parseInt(a.orderNumber);
                    const nb = parseInt(b.orderNumber);
                    if (!isNaN(na) && !isNaN(nb)) return na - nb;
                    return (a.time || '').localeCompare(b.time || '');
                });

                const rows = [];
                for (let i = 0; i < allOrders.length; i += 3) {
                    const chunk = allOrders.slice(i, i + 3);
                    const row = chunk.map(order => ({
                        number: order.orderNumber,
                        driver: order.driverName || 'غير معروف',
                        timeOut: order.time || '',
                        timeReturn: order.returnTime || ''
                    }));
                    while (row.length < 3) {
                        row.push({ number: '', driver: '', timeOut: '', timeReturn: '' });
                    }
                    rows.push(row);
                }

                const printArea = document.getElementById('printArea');
                let html = `
                    <div style="direction:rtl;font-family:'Plus Jakarta Sans',sans-serif;padding:24px;background:white;color:black;">
                    <h2 style="text-align:center;color:#d4af37;margin-bottom:4px;">كشف توصيل الطلبات الخارجية</h2>
                    <div style="text-align:center;color:#666;font-size:.85rem;margin-bottom:18px;">ريدان للمندي · ${new Date().toLocaleDateString('ar-EG')}</div>
                    <table style="width:100%;border-collapse:collapse;font-size:12px;text-align:center;">
                    <thead>
                        <tr>
                            <th>الرقم</th><th>الدليفري</th><th>وقت الطلوع</th><th>وقت الرجوع</th>
                            <th>الرقم</th><th>الدليفري</th><th>وقت الطلوع</th><th>وقت الرجوع</th>
                            <th>الرقم</th><th>الدليفري</th><th>وقت الطلوع</th><th>وقت الرجوع</th>
                        </tr>
                    </thead>
                    <tbody>
                `;
                rows.forEach(row => {
                    html += `<tr>`;
                    row.forEach(col => {
                        html +=
                            `<td>${col.number}</td><td>${col.driver}</td><td>${col.timeOut}</td><td>${col.timeReturn}</td>`;
                    });
                    html += `</tr>`;
                });
                html += `</tbody></table></div>`;
                printArea.innerHTML = html;

                const win = window.open('', '_blank');
                if (!win) { showToast(t('allowPopup')); return; }
                win.document.write(`<html dir="rtl"><head><meta charset="UTF-8"><title>كشف التوصيل</title>
                <style>
                    body{font-family:'Plus Jakarta Sans',sans-serif;padding:24px;background:white;color:black;}
                    table{width:100%;border-collapse:collapse;font-size:12px;text-align:center;}
                    th,td{border:1px solid #222;padding:6px 4px;}
                    th{background:#d4af37;color:#0a0808;}
                    h2{text-align:center;color:#d4af37;margin-bottom:4px;}
                    .sub{text-align:center;color:#666;font-size:.85rem;margin-bottom:18px;}
                </style>
                </head><body>
                <h2>كشف توصيل الطلبات الخارجية</h2>
                <div class="sub">ريدان للمندي · ${new Date().toLocaleDateString('ar-EG')}</div>
                <table>
                <thead><tr><th>الرقم</th><th>الدليفري</th><th>وقت الطلوع</th><th>وقت الرجوع</th><th>الرقم</th><th>الدليفري</th><th>وقت الطلوع</th><th>وقت الرجوع</th><th>الرقم</th><th>الدليفري</th><th>وقت الطلوع</th><th>وقت الرجوع</th></tr></thead><tbody>`);
                rows.forEach(row => {
                    win.document.write(`<tr>`);
                    row.forEach(col => {
                        win.document.write(
                            `<td>${col.number}</td><td>${col.driver}</td><td>${col.timeOut}</td><td>${col.timeReturn}</td>`
                            );
                    });
                    win.document.write(`</tr>`);
                });
                win.document.write(`</tbody></table></body></html>`);
                win.document.close();
                win.print();
            }

            // ===== ADMIN TOGGLE =====

                if (show) {
                    overlay.classList.add('active');
                    renderAll();
                } else {

                document.getElementById('adminOrdersTitle').innerHTML =
                    '<i class="fas fa-list"></i> ' + t('adminOrdersTitle') +

                    '<i class="fas fa-archive"></i> ' + t('adminArchiveTitle') +
                    ' <span class="en">Today\'s Archive</span>';
                document.getElementById('addBtnLabel').textContent = t('addBtnLabel');
                document.getElementById('clearArchiveLabel').textContent = t('clearArchiveLabel');
                document.getElementById('adminResetLabel').textContent = t('adminResetLabel');
                document.getElementById('adminEndDayLabel').textContent = t('adminEndDayLabel');

                    'Driver Name';

            // ===== INIT =====
            document.addEventListener('DOMContentLoaded', function() {
                loadState();
                drivers.forEach(d => { if (d.orders === undefined) d.orders = 0; if (d.image === undefined) d.image =
                    ''; if (d.hidden === undefined) d.hidden = false; if (d.status === undefined) d.status =
                    'متاح'; });

                const browserLang = navigator.language || 'ar';
                currentLang = browserLang.startsWith('en') ? 'en' : 'ar';
                document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
                document.documentElement.lang = currentLang;
                document.getElementById('appWrapper').className = 'app-wrapper' + (currentLang === 'en' ? ' lang-en' : '');
                document.getElementById('langLabel').textContent = t('langLabel');
                document.getElementById('langIndicator').textContent = t('langIndicator');

                renderAll();

                // Events
                document.getElementById('langToggle').addEventListener('click', toggleLang);

                document.getElementById('openAdminBtn').addEventListener('click', () => toggleAdmin(true));
                document.getElementById('closeAdminBtn').addEventListener('click', () => toggleAdmin(false));
                document.getElementById('adminOverlay').addEventListener('click', function(e) {
                    if (e.target === this) toggleAdmin(false);
                });

                document.getElementById('adminResetBtn').addEventListener('click', resetQueue);
                document.getElementById('adminEndDayBtn').addEventListener('click', endDay);
                document.getElementById('adminPrintBtn').addEventListener('click', printPdf);

                document.getElementById('startDeliveryBtn').addEventListener('click', startDelivery);
                document.getElementById('orderNumber').addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') startDelivery();
                });
                document.getElementById('orderNumber').addEventListener('input', function() {
                    document.getElementById('orderError').style.display = 'none';
                });

                document.getElementById('addDriverBtn').addEventListener('click', function() {
                    const nameInput = document.getElementById('newDriverName');
                    const name = nameInput.value.trim();
                    if (!name) { showToast(t('enterOrder')); return; }
                    if (drivers.some(d => d.name === name)) { showToast(t('driverExists')); return; }
                    const newId = Date.now() + Math.random();
                    drivers.push({ id: newId, name: name, orders: 0, image: '', hidden: false, status: 'متاح' });
                    nameInput.value = '';
                    saveState();
                    renderAll();
                    showToast(t('driverAdded'));
                });

                document.getElementById('clearArchiveBtn').addEventListener('click', function() {
                    if (confirm(t('confirmClear'))) {
                        archive = [];
                        saveState();
                        renderAll();
                        showToast(t('archiveCleared'));
                    }
                });

                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') toggleAdmin(false);
                });

                window.addEventListener('storage', function(e) {
                    if (e.key === 'deliveryData') {
                        loadState();
                        renderAll();
                    }
                });

                setInterval(() => {
                    const stored = localStorage.getItem('deliveryData');
                    if (stored) {
                        const current = JSON.stringify({ drivers, orders, archive, nextOrderId });
                        if (current !== stored) {
                            loadState();
                            renderAll();
                        }
                    }
                }, 3000);

                setTimeout(() => {
                    document.getElementById('brandTitle').textContent = t('brandTitle');
                    document.getElementById('brandSub').textContent = t('brandSub');
                    document.getElementById('orderTitle').textContent = t('orderTitle');
                    document.getElementById('orderTitleEn').textContent = t('orderTitleEn');
                    document.getElementById('deliveryTypeLabel').innerHTML = t('deliveryTypeLabel') +
                        ' <span class="en">Delivery Type</span>';
                    document.getElementById('orderNumberLabel').innerHTML = t('orderNumberLabel') +
                        ' <span class="en">Order #</span>';
                    document.getElementById('startBtnLabel').textContent = t('startBtnLabel');
                    document.getElementById('driversTitle').textContent = t('driversTitle');
                    document.getElementById('queueLabel').textContent = t('queueLabel');
                    document.getElementById('adminBtnLabel').textContent = t('adminBtnLabel');
                    document.getElementById('adminPanelTitle').innerHTML =
                        '<i class="fas fa-crown" style="color:var(--gold);"></i> ' + t('adminPanelTitle') +
                        ' <span class="en">Control Panel</span>';
                    document.getElementById('adminDriversTitle').innerHTML =
                        '<i class="fas fa-edit"></i> ' + t('adminDriversTitle') +
                        ' <span class="en">Manage Drivers</span>';
                    document.getElementById('adminOrdersTitle').innerHTML =
                        '<i class="fas fa-list"></i> ' + t('adminOrdersTitle') +
                        ' <span class="en">Active Orders</span>';
                    document.getElementById('adminArchiveTitle').innerHTML =
                        '<i class="fas fa-archive"></i> ' + t('adminArchiveTitle') +
                        ' <span class="en">Today\'s Archive</span>';
                    document.getElementById('addBtnLabel').textContent = t('addBtnLabel');
                    document.getElementById('clearArchiveLabel').textContent = t('clearArchiveLabel');
                    document.getElementById('adminResetLabel').textContent = t('adminResetLabel');
                    document.getElementById('adminEndDayLabel').textContent = t('adminEndDayLabel');
                    document.getElementById('adminPrintLabel').textContent = t('adminPrintLabel');
                    document.getElementById('orderNumber').placeholder = currentLang === 'ar' ? 'مثال: 1087' :
                        'e.g. 1087';
                    document.getElementById('newDriverName').placeholder = currentLang === 'ar' ? 'اسم الدليفري' :
                        'Driver Name';
                    document.getElementById('selectedLabel').textContent = t('selectedLabel');
                    updateSelectedDriverDisplay();
                }, 50);
            });

        })();
    </script>
</body>
</html>
